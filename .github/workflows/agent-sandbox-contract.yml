name: Agent Sandbox Contract

on:
  pull_request:
    paths:
      - 'scripts/dev/agent_sandbox_contract.py'
      - 'scripts/dev/test_agent_sandbox_contract.py'
      - '.github/workflows/agent-sandbox-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify on-demand sandbox planning contract
        run: python -m unittest discover -s scripts/dev -p 'test_agent_sandbox_contract.py' -v

name: Go Control Plane

concurrency:
  group: go-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gpu
          POSTGRES_PASSWORD: gpu
          POSTGRES_DB: gpu_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gpu -d gpu_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgres://gpu:gpu@localhost:5432/gpu_platform_test?sslmode=disable
      TEST_POSTGRES_STORE_DSN: postgres://gpu:gpu@localhost:5432/gpu_store_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Dependencies
        run: go mod tidy
      - name: Module files clean
        run: |
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "go.mod/go.sum are not tidy:"
            git status --short -- go.mod go.sum
            git diff -- go.mod go.sum
            exit 1
          fi
      - name: Provision independent Store package test database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U gpu -d gpu_platform_test -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE gpu_store_test'
      - name: Format check
        run: make fmt-check
      - name: Install pinned security and SBOM tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Reachable dependency vulnerability scan
        run: govulncheck ./...
      - name: Vet
        run: go vet ./...
      - name: Test (parallel Go packages with independent PostgreSQL databases)
        run: make test-parallel-isolated
      - name: Release acceptance contracts
        run: make acceptance-contract
      - name: Production supply-chain policy
        run: make supply-chain-check
      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/control-plane ./cmd/control-plane
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/cluster-agent ./cmd/cluster-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/management-api ./cmd/management-api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/verifiedops-observer ./cmd/verifiedops-observer
      - name: Generate CycloneDX SBOMs for shipped binaries
        run: |
          set -euo pipefail
          for app in control-plane cluster-agent management-api verifiedops-observer; do
            case "$app" in
              control-plane) main="cmd/control-plane" ;;
              cluster-agent) main="cmd/cluster-agent" ;;
              management-api) main="cmd/management-api" ;;
              verifiedops-observer) main="cmd/verifiedops-observer" ;;
            esac
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 cyclonedx-gomod app \
              -json -licenses -std -output "dist/$app.bom.json" \
              -main "$main" .
          done
          (cd dist && sha256sum control-plane cluster-agent management-api verifiedops-observer *.bom.json > SHA256SUMS)
      - name: Upload binaries, SBOMs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: gpu-compute-platform-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Attest binary build provenance
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/control-plane
            dist/cluster-agent
            dist/management-api
            dist/verifiedops-observer
      - name: Attest Control Plane SBOM
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/control-plane
          sbom-path: ${{ github.workspace }}/dist/control-plane.bom.json
      - name: Attest Cluster Agent SBOM
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/cluster-agent
          sbom-path: ${{ github.workspace }}/dist/cluster-agent.bom.json
      - name: Attest Management API SBOM
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/management-api
          sbom-path: ${{ github.workspace }}/dist/management-api.bom.json
      - name: Attest Observer SBOM
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/verifiedops-observer
          sbom-path: ${{ github.workspace }}/dist/verifiedops-observer.bom.json
      - name: Build canonical container entrypoints
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker build -f Dockerfile -t gpu-control-plane:test .
          docker build -f Dockerfile --target control-plane -t gpu-control-plane:target-test .
          docker build -f Dockerfile --target cluster-agent -t gpu-cluster-agent:test .
          docker build -f Dockerfile --target management-api -t gpu-management-api:ci .
      - name: Verify nonroot Management container and fail-closed startup
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          bash -n scripts/e2e/management-image-security-smoke.sh
          bash scripts/e2e/management-image-security-smoke.sh gpu-management-api:ci
      - name: Build compatibility container targets
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          docker build -f Dockerfile.control-plane --target control-plane -t gpu-control-plane:compat-test .
          docker build -f Dockerfile.control-plane --target cluster-agent -t gpu-cluster-agent:compat-test .

  portal:
    name: Go Portal / Vue contract build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing Vue dependencies
        working-directory: frontend
        run: npm ci
      - name: Project and operations-triage contract tests
        working-directory: frontend
        run: npm run portal:test
      - name: Typecheck and build isolated Go Portal
        working-directory: frontend
        run: npm run portal:build
      - name: Management PKCE, CAS and receipt browser-contract tests
        working-directory: frontend
        run: npm run management:test
      - name: Management receipt and evidence OIDC-scope race regressions
        working-directory: frontend
        run: npm run test:unit -- tests/unit/useReceipt.test.ts tests/unit/useEvidence.test.ts
      - name: Build isolated OIDC Management workbench
        working-directory: frontend
        run: npm run management:build

  portal-browser:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    name: Portal / real Chromium to Go API
    runs-on: ubuntu-latest
    timeout-minutes: 18
    needs: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing Vue dependencies
        working-directory: frontend
        run: npm ci
      - name: Install isolated browser test runner without changing lockfile
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install pinned Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Validate local launch scripts syntax
        run: bash -n scripts/dev/portal-local.sh scripts/e2e/portal-local-launch-smoke.sh scripts/e2e/portal-browser-e2e.sh
      - name: Run real API-backed Portal Chromium acceptance
        run: bash scripts/e2e/portal-browser-e2e.sh
      - name: Smoke one-command local Portal startup, isolation and shutdown
        run: bash scripts/e2e/portal-local-launch-smoke.sh

  golden-path:
    name: Golden Path / kind + Kueue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - uses: azure/setup-helm@v4
      - name: Install kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
      - name: Run Go Golden Path
        env:
          # Prove the portable accelerator class is independent from the
          # provider-specific Kueue ResourceFlavor name.
          ACCELERATOR_FLAVOR: kueue-h100
        run: bash scripts/e2e/go-kind-kueue-golden.sh

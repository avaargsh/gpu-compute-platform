name: Go Control Plane

concurrency:
  group: go-control-plane-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/control-plane-v2-go
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - ".github/workflows/go-control-plane.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Dependencies
        run: |
          rm -f go.sum
          go mod tidy
      - name: Capture module graph
        uses: actions/upload-artifact@v4
        with:
          name: go-module-files
          path: |
            go.mod
            go.sum
      - name: Module files clean
        run: git diff --exit-code -- go.mod go.sum
      - name: Format check
        run: |
          files="$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "gofmt required for:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build binaries
        run: |
          go build ./cmd/control-plane
          go build ./cmd/cluster-agent
      - name: Build container targets
        run: |
          docker build -f Dockerfile.go --target control-plane -t gpu-control-plane:test .
          docker build -f Dockerfile.go --target cluster-agent -t gpu-cluster-agent:test .

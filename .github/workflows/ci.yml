name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "feat/**"

permissions:
  contents: read

jobs:
  control-plane-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run control-plane contract tests
        run: uv run pytest -q tests/test_control_plane_contracts.py tests/test_kueue_adapter.py tests/test_kueue_scheduler_provider.py tests/test_compute_pool.py tests/test_device_providers.py tests/test_serving_plane.py tests/test_endpoint_traffic.py tests/test_kserve_provider.py tests/test_inference_pool.py

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run control-plane contract tests
        run: uv run pytest -q tests/test_control_plane_contracts.py tests/test_kueue_adapter.py tests/test_kueue_scheduler_provider.py

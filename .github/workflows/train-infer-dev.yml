name: Train and Batch Inference Dev

on:
  push:
    branches:
      - feat/dev-apply-train-infer-workload-20261015
    paths:
      - 'scripts/dev/apply_workload_draft.py'
      - 'scripts/dev/test_apply_workload_draft.py'
      - 'scripts/dev/workspace_pvc.py'
      - 'scripts/dev/test_workspace_pvc.py'
      - 'scripts/dev/workspace_durability.py'
      - 'scripts/dev/test_workspace_durability.py'
      - '.github/workflows/train-infer-dev.yml'
  pull_request:
    paths:
      - 'scripts/dev/apply_workload_draft.py'
      - 'scripts/dev/test_apply_workload_draft.py'
      - 'scripts/dev/workspace_pvc.py'
      - 'scripts/dev/test_workspace_pvc.py'
      - 'scripts/dev/workspace_durability.py'
      - 'scripts/dev/test_workspace_durability.py'
      - '.github/workflows/train-infer-dev.yml'
  workflow_dispatch:

jobs:
  local-workload-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Workload and PVC create/read/durability acceptance
        run: python3 -m unittest discover -s scripts/dev -p 'test_*.py' -v

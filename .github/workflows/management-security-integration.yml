name: Management Real Security Integration

on:
  pull_request:
    branches: [master]
    paths:
      - 'cmd/management-api/**'
      - 'Dockerfile'
      - 'scripts/e2e/management-image-security-smoke.sh'
      - 'internal/platform/management/**'
      - 'internal/store/postgres/schema.sql'
      - 'scripts/e2e/management-keycloak-https.sh'
      - 'scripts/e2e/management-postgres-real-tls.sh'
      - 'scripts/e2e/keycloak-management-realm.json'
      - '.github/workflows/management-security-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keycloak-https:
    name: Keycloak HTTPS / issued-token revocation
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify test harness shell syntax
        run: bash -n scripts/e2e/management-keycloak-https.sh
      - name: Real disposable HTTPS Keycloak introspection and revocation
        run: bash scripts/e2e/management-keycloak-https.sh

  postgres-verified-tls:
    name: PostgreSQL verify-full / constrained login / certificate rotation
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Verify test harness shell syntax
        run: bash -n scripts/e2e/management-postgres-real-tls.sh scripts/e2e/management-image-security-smoke.sh
      - name: Disposable PostgreSQL TLS and production management binary security gates
        run: bash scripts/e2e/management-postgres-real-tls.sh

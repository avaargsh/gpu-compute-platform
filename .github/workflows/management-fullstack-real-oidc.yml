name: Management Full Stack Real OIDC Acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - 'cmd/management-api/**'
      - 'internal/platform/management/**'
      - 'internal/store/postgres/schema.sql'
      - 'frontend/src/management/**'
      - 'frontend/playwright.management.fullstack.config.ts'
      - 'frontend/tests/e2e/management.fullstack.e2e.spec.ts'
      - 'frontend/vite.management.config.ts'
      - 'frontend/management.html'
      - 'scripts/e2e/management-fullstack-real-oidc-pg.sh'
      - 'scripts/e2e/keycloak-management-browser-realm.json'
      - '.github/workflows/management-fullstack-real-oidc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: management-real-oidc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-oidc-pg-browser:
    name: Real Keycloak PKCE / Chromium / guarded Go / PostgreSQL TLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check disposable full stack test fixture syntax
        run: |
          bash -n scripts/e2e/management-fullstack-real-oidc-pg.sh
          python3 -m json.tool scripts/e2e/keycloak-management-browser-realm.json >/dev/null
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install ephemeral browser test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real S256 PKCE to verified-TLS PostgreSQL with mutable DB authorization
        run: bash scripts/e2e/management-fullstack-real-oidc-pg.sh

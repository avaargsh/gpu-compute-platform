name: Management Full Stack Real OIDC Acceptance

# Heavy integration run on explicit request or v* release tags.
# Management auth, CAS and security regressions still run in regular Go CI.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: management-real-oidc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-oidc-pg-browser:
    name: Real Keycloak PKCE / Chromium / guarded Go / PostgreSQL TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check disposable full stack test fixture syntax
        run: |
          bash -n scripts/e2e/management-fullstack-real-oidc-pg.sh
          python3 -m json.tool scripts/e2e/keycloak-management-browser-realm.json >/dev/null
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install ephemeral browser test runner
        working-directory: frontend
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run real S256 PKCE to verified-TLS PostgreSQL with mutable DB authorization
        run: bash scripts/e2e/management-fullstack-real-oidc-pg.sh

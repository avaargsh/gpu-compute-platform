services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gpu_platform
      POSTGRES_USER: gpu
      POSTGRES_PASSWORD: gpu
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./internal/store/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu -d gpu_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/control-plane"]
    working_dir: /src
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://gpu:gpu@postgres:5432/gpu_platform?sslmode=disable
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  cluster-agent-dev:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/cluster-agent"]
    working_dir: /src
    environment:
      CLUSTER_ID: ${CLUSTER_ID:-local-cluster}
      CONTROL_PLANE_URL: http://control-plane-dev:8080
      KUBECONFIG: /kube/config
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-}
      AGENT_SYNC_INTERVAL: ${AGENT_SYNC_INTERVAL:-15s}
    volumes:
      - .:/src
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - ${KUBECONFIG:-$HOME/.kube/config}:/kube/config:ro
    depends_on:
      - control-plane-dev

volumes:
  postgres_dev_data:
  go_mod_cache:
  go_build_cache:

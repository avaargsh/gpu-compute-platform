services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gpu_platform
      POSTGRES_USER: gpu
      POSTGRES_PASSWORD: gpu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/store/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu -d gpu_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
      target: control-plane
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://gpu:gpu@postgres:5432/gpu_platform?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  cluster-agent:
    profiles: ["agent"]
    build:
      context: .
      dockerfile: Dockerfile
      target: cluster-agent
    environment:
      CLUSTER_ID: ${CLUSTER_ID:-local-cluster}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://control-plane:8080}
      KUBECONFIG: /kube/config
      AGENT_INSTANCE_ID: ${AGENT_INSTANCE_ID:-}
      AGENT_SYNC_INTERVAL: ${AGENT_SYNC_INTERVAL:-15s}
    volumes:
      - ${KUBECONFIG:-$HOME/.kube/config}:/kube/config:ro
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  postgres_data:
